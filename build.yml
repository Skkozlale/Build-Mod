name: Build Mod

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Скачиваем код репозитория
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Устанавливаем Java 21 (нужна для MC 1.21.4)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 3. Делаем gradlew исполняемым (важно для Linux, на котором идет сборка)
      - name: Make gradlew executable
        run: chmod +x gradlew

      # 4. Запускаем сборку
      - name: Build with Gradle
        run: ./gradlew build

      # 5. Загружаем готовый .jar файл обратно на GitHub, чтобы вы могли его скачать
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MyMod-Jar
          path: build/libs/*.jar